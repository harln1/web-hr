<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=
    , initial-scale=1.0">
    <title>Document</title>
    <style>
        button{
            /*가로 세로 지정*/
            width :200px;
            height: 200px;
            background-color: cornflowerblue;
            }
    </style>
</head>
<body>
    <!--HTML에서 버튼을 만드는 방법-->
    <!-- 1. <Button> 태그 -->
    <button><strong>클릭하세요</strong></button>

    <!-- input 태그의 type속성을 button으로 주기튼
     종료 태그가 없고 ,
     글자는 VALUE속성으로 지정
     HTML 태그 삽입이 불가능하다.-->
     <input type="button"value="input 버튼">
</body>
</html>
