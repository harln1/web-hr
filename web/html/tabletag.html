<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>성적표</title>
</head>

<body>

    <table border="1">
        <!-- 표의 제목부분 -->
        <thead>
            <tr>
                <th>이름</th>
                <th>과목</th>
                <th>점수</th>
            </tr>
        </thead>

        <!-- 실제 데이터가 들어가는 영역 -->
        <tbody>
            <tr>
                <td>김철수</td>
                <td>HTML</td>
                <td>90</td>
            </tr>
            <tr>
                <td>이영희</td>
                <td>CSS</td>
                <td>95</td>
            </tr>
            <tr>
                <td>박민수</td>
                <td>JS</td>
                <td>70</td>
            </tr>
        </tbody>

        <!-- 표의 바닥 부분 -->
        <tfoot>
            <tr>
                <td colspan="2">평균점수</td>
                <td>85</td>
            </tr>
        </tfoot>
    </table>

</body>

</html>
