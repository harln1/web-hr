<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>자유게시판</title>
    <style>
        /* [CSS] 기본 설정 */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans KR', sans-serif, Arial;
            background: #f8f9fa;
            color: #333333;
            padding: 40px 20px;
        }

        /* [CSS] 게시판 전체 박스 */
        .board-container {
            max-width: 900px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.05);
        }

        /* [CSS] 헤더 영역 */
        .board-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 25px 30px;
            border-bottom: 2px solid #eeeeee;
        }

        .board-title {
            font-size: 24px;
            font-weight: bold;
        }

        /* [CSS] 검색창과 버튼 영역 */
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-box {
            padding: 8px 14px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            width: 200px;
        }

        .write-btn {
            padding: 8px 16px;
            border: none;
            background-color: #007bff;
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
        }

        /* [CSS] 게시글 목록 영역 */
        .list-header,
        .post-row {
            display: flex;
            align-items: center;
            padding: 15px 30px;
        }

        .list-header {
            background-color: #fafafa;
            border-bottom: 1px solid #e9ecef;
            font-weight: bold;
            color: #555555;
            font-size: 15px;
        }

        .post-row {
            border-bottom: 1px solid #f1f3f5;
            font-size: 15px;
        }

        /* [CSS] 각 열의 크기 지정 */
        .col-no {
            width: 60px;
            text-align: center;
        }

        .col-title {
            flex: 1;
            padding: 0 15px;
        }

        .col-author {
            width: 100px;
            text-align: center;
        }

        .col-date {
            width: 110px;
            text-align: center;
            color: #666666;
        }

        .col-views {
            width: 70px;
            text-align: center;
            color: #666666;
        }

        /* [CSS] 제목 링크 */
        .col-title a {
            color: #212529;
            text-decoration: none;
        }

        .col-title a:hover {
            text-decoration: underline;
        }

        /* [CSS] 페이지 번호 영역 */
        .pagination {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 30px 0;
        }

        /* [CSS] 페이지 버튼 */
        .page-btn {
            padding: 6px 12px;
            border: 1px solid #dee2e6;
            background: #ffffff;
            font-size: 14px;
            border-radius: 4px;
            cursor: pointer;
            color: #495057;
        }

        .page-btn.active {
            background: #007bff;
            color: #ffffff;
            border-color: #007bff;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <!-- [HTML] 게시판 전체 박스 -->
    <div class="board-container">

        <!-- [HTML] 헤더 영역 -->
        <header class="board-header">
            <h1 class="board-title">📌 자유게시판</h1>
            <div class="header-actions">
                <input type="text" class="search-box" placeholder="제목을 검색하세요">
                <button class="write-btn">글쓰기</button>
            </div>
        </header>

        <!-- [HTML] 게시글 목록 제목 영역 -->
        <div class="list-header">
            <span class="col-no">번호</span>
            <span class="col-title">제목</span>
            <span class="col-author">작성자</span>
            <span class="col-date">작성일</span>
            <span class="col-views">조회수</span>
        </div>

        <!-- [HTML] 게시글 목록 영역 -->
        <div class="post-list">
            <!-- 게시글 5 -->
            <div class="post-row">
                <span class="col-no">5</span>
                <span class="col-title"><a href="#">도서관 휴관 안내 (6월 25일)</a></span>
                <span class="col-author">관리자</span>
                <span class="col-date">2026-06-18</span>
                <span class="col-views">128</span>
            </div>
            <!-- 게시글 4 -->
            <div class="post-row">
                <span class="col-no">4</span>
                <span class="col-title"><a href="#">신간 도서 입고 안내드립니다</a></span>
                <span class="col-author">관리자</span>
                <span class="col-date">2026-06-15</span>
                <span class="col-views">96</span>
            </div>
            <!-- 게시글 3 -->
            <div class="post-row">
                <span class="col-no">3</span>
                <span class="col-title"><a href="#">스터디룸 예약 방법 문의드립니다</a></span>
                <span class="col-author">김도윤</span>
                <span class="col-date">2026-06-12</span>
                <span class="col-views">54</span>
            </div>
            <!-- 게시글 2 -->
            <div class="post-row">
                <span class="col-no">2</span>
                <span class="col-title"><a href="#">반납 연체료 관련 질문있어요</a></span>
                <span class="col-author">이서연</span>
                <span class="col-date">2026-06-10</span>
                <span class="col-views">41</span>
            </div>
            <!-- 게시글 1 -->
            <div class="post-row">
            
                <span class="col-no">1</span>
                <span class="col-title"><a href="#">전자책 대출 서비스 오픈했습니다</a></span>
                <span class="col-author">관리자</span>
                <span class="col-date">2026-06-05</span>
                <span class="col-views">203</span>
            </div>
        </div>

        <!-- [HTML] 페이지 번호 영역 -->
        <div class="pagination">
            <button class="page-btn">이전</button>
            <button class="page-btn active">1</button>
            <button class="page-btn">2</button>
            <button class="page-btn">3</button>
            <button class="page-btn">4</button>
            <button class="page-btn">5</button>
            <button class="page-btn">다음</button>
        </div>

    </div>

</body>

</html>
