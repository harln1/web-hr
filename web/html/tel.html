<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>버튼 스타일 확인</title>
    <style>
  
        .btn {
            padding: 16px 24px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            background-color: #e0e0e0;
        
            color: #333333;
        }

    
        .btn--success {
            background-color: #2ecc71;
            color: white;
        }

  
        .btn--danger {
            background-color: #e74c3c;
            color: white;
        }


        .btn--primary {
            background-color: #3498db;
            color: white;
        }

  
        .btn--large {
            padding: 22px 36px;
            font-size: 22px;
      
        }
    </style>
</head>

<body>

  
    <button class="btn btn--success">확인</button>

    <button class="btn btn--danger">삭제</button>

    <button class="btn btn--primary btn--large">확인(크게)</button>

</body>

</html>
