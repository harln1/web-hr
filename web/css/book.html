<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <title>도서 상세 화면</title>
    <style>
        body {
            background-color: #eee;
            font-family: Arial, sans-serif;
        }

        .container {
            border: 2px solid black;
            background-color: white;
            padding: 20px;
            max-width: 600px;
            margin: 20px auto;
        }

        h1 {
            color: darkgreen;
            font-size: 30px;
        }

        .book-info {
            border: 1px solid gray;
            background-color: #f9f9f9;
            padding: 15px;
            margin-bottom: 15px;
        }
    </style>
</head>

<body>
    <div class="container">
         <h1>도서 상세 화면</h1>
        <img src="book.jpg" alt="도서 표지" width="200"><br><br>

        
        <div class="book-info">
            <h2> HTML 기초 입문 </h2>
            <p><strong>저자:</strong> 김코딩</p>
            <p><strong>출판사:</strong> 웹북스</p>
            <p><strong>대여 가능 여부:</strong> 대여 가능</p>
        </div>

        <h3>도서 설명</h3>    
        <p>이 책은 HTML을 처음 배우는 학습자를 위한 입문서 입니다.
            웹 페이지의 기본 구조와 태그 사용법을 쉽게 설명합니다.
            이미지,링크,목록,표 입력 요소를 단계적으로 학습할 수 있습니다.
        </p> 
         





         

        <input type="button" value="대여하기"><br><br>
        <a href="book-list.html">목록으로 돌아가기</a>
    </div>
</body>

</html>
