<!DOCTYPE html> 
<html lang="en">
</html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Apply</title>
    <style>
    
    <!-- 테두리관련 스타일 속성
     border-width : 
     - 테두리 두께
     - 속성값 : thin, medium, thick , 직접지정
     border-style : 
     - 테두리 스타일
     - 속성값 : none(없음), hidden(숨김), solid(실선), dashed대시선 (- - -), dotted(점선), double(이중선)
     border-color : 
     - 테두리 색상
     border-radius : 
     - 둥근모서리
     border :
     - 굵기,스타일,색상을 한번에 지정하는 단축 속성
     - 순서는 무관하다
     -->

    p{
        border-width: 5px;
        border-color: blue;
    }

    .box1 {border-style:none;}
    .box2 {border-style:solid;}
    .box3 {border-style:dotted;}
    .box4 {border-style:dashed;}
    .box5 {border-style:double;}
    .box6 {border-style:groove;}
    .box7 {border: 3px solid red;}

    .div1{
        border:2px solid gray;
    }
    .div2{
        border: 10px solid red;
        width: 200px;
    }
    </style>

</head>
<body>
    <p class="box1">border 테스트 </p>
    <p class="box2">border 테스트 </p>
    <p class="box3">border 테스트 </p>
    <p class="box4">border 테스트 </p> 
    <p class="box5">border 테스트 </p>
    <p class="box6">border 테스트 </p>
    <p class="box7">border 테스트 </p>
    <p class="box8">border 테스트 </p>
    <p class="box9">border 테스트 </p>
    <p class="box10">border 테스트 </p>

    <div class ="div1">
        div에 테두리추기
    </div>

    <div class="div2">
        div에 테두리추기
    </div>

    <div class="div3">
        div에 테두리추기
    </div>


</body>
</html>
