<!DOCTYPE html>
< lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* 글자 스타일 
        font-size: 글자 크기
        font-weight: 글자 두께
        font-style: 글자 스타일/기울임
        font-family: 글꼴
        font : 스타일 두께 사이즈 family(순서를 항상 지키기)
        */
        .a1 {
            font-size: 30px;
        }

        .a2 {
            font-style: italic;
        }

        .a3 {
            font-weight: 700;
        }

        .a4 {
            font-family: "궁서","굴림", sans-serif;
        }

        .a5 {
            font: italic bold 20px "궁서","돋움", sans-serif;
        }

    </style>
</head>
<body>
    <p class="a1">글자크기</p>
    <p class="a2">글자스타일</p>
    <p class="a3">글자두께</p>
    <p class="a4">글자변경</p>
    <p class="a5">글자축약속성</p>
</body>
</html>
